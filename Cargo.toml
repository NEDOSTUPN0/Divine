[package]
name = "divine"
version = "1.0.0"
edition = "2021"
description = "Native GTK4 launcher for Epic Games, powered by Legendary"
license = "GPL-3.0-or-later"
repository = "https://github.com/NEDOSTUPN0/Divine"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
dirs = "6.0.0"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_12"] }
gst = { package = "gstreamer", version = "0.25.3" }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_8"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
ureq = "3.4.0"
libc = "0.2.189"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
