    <path transform="translate(0 1)" fill="url(#face)" d="M48 56 H80 C90 56 96.5 62.5 98 72 L100.5 86 C101.5 93.5 94 97.5 88.5 92 L82 85.5 H46 L39.5 92 C34 97.5 26.5 93.5 27.5 86 L30 72 C31.5 62.5 38 56 48 56 Z"/>

    <!-- d-pad -->
    <g transform="translate(0 1.2)" fill="#4a2466">
      <rect x="42" y="64" width="5" height="15" rx="1.2"/>
      <rect x="37" y="69" width="15" height="5" rx="1.2"/>
    </g>
    <g fill="#f6f5f4">
      <rect x="42" y="64" width="5" height="15" rx="1.2"/>
      <rect x="37" y="69" width="15" height="5" rx="1.2"/>
    </g>

    <!-- face buttons -->
    <g fill="#4a2466" transform="translate(0 1.2)">
      <circle cx="81" cy="65" r="3"/><circle cx="81" cy="78" r="3"/>
      <circle cx="74.5" cy="71.5" r="3"/><circle cx="87.5" cy="71.5" r="3"/>
    </g>
    <g fill="#f6f5f4">
