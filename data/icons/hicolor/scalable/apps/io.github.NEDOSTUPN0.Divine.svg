  </defs>

  <!-- gamepad body -->
  <g transform="translate(64 75) scale(1.3) translate(-64 -75)">
    <path transform="translate(0 6)" fill="url(#side)" d="M48 56 H80 C90 56 96.5 62.5 98 72 L100.5 86 C101.5 93.5 94 97.5 88.5 92 L82 85.5 H46 L39.5 92 C34 97.5 26.5 93.5 27.5 86 L30 72 C31.5 62.5 38 56 48 56 Z"/>
