<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="face" x1="0" y1="56" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9141ac"/>
      <stop offset="1" stop-color="#813d9c"/>
    </linearGradient>
    <linearGradient id="side" x1="27" y1="0" x2="101" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a2466"/>
      <stop offset="0.25" stop-color="#613583"/>
      <stop offset="0.75" stop-color="#613583"/>
      <stop offset="1" stop-color="#4a2466"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="20" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9f06b"/>
      <stop offset="1" stop-color="#f6d32d"/>
