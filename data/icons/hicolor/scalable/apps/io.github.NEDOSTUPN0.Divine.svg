  <!-- halo -->
  <ellipse cx="64" cy="32" rx="26" ry="8.5" fill="none" stroke="#c88800" stroke-width="6"/>
  <ellipse cx="64" cy="29" rx="26" ry="8.5" fill="none" stroke="url(#gold)" stroke-width="6"/>
